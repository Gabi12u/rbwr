# Builds the app for Windows (program + installer), macOS and Linux and
# publishes the files as a GitHub release, so the newest version is always at
# https://github.com/Gabi12u/rbwr/releases/latest
#
# Runs when the app changes on main, for tags like v1.2.0, or by hand
# (Actions -> Build app -> Run workflow).
name: Build app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "installer/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: rbwr-demands.exe
            name: rbwr-demands-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            file: rbwr-demands
            name: rbwr-demands-macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            file: rbwr-demands
            name: rbwr-demands-macos-intel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: rbwr-demands
            name: rbwr-demands-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "dist/${{ matrix.name }}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" installer\rbwr-demands.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RBWR Demands ${{ steps.version.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            **Windows:** `RBWR-Demands-Setup.exe` herunterladen und starten. Es installiert die App (ohne Admin-Rechte) mit Startmenü-Eintrag und Desktop-Symbol und öffnet sie danach. Warnt Windows („Der Computer wurde durch Windows geschützt"): *Weitere Informationen → Trotzdem ausführen*.

            Ohne Installation: `rbwr-demands-windows-x64.exe` (einfach doppelklicken).

            **macOS:** `rbwr-demands-macos-apple-silicon` (M1/M2/…) oder `rbwr-demands-macos-intel`. **Linux:** `rbwr-demands-linux-x64`. Vorher `chmod +x` ausführen.

            Die App öffnet die Seite im Browser unter http://localhost:3000/ mit Live-Daten (alle 15 Sekunden). Zum Beenden das Fenster schließen.
