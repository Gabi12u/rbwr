name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript tests
        run: npm test
